services:
  database:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
      POSTGRES_DB: ${POSTGRES_DB:-iot_monitoring}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_HOST_PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-iot_monitoring}?schema=public"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in root .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      TB_BASE_URL: ${TB_BASE_URL:-http://thingsboard:8080}
      TB_JWT_TOKEN: ${TB_JWT_TOKEN:-}
      TB_USERNAME: ${TB_USERNAME:-}
      TB_PASSWORD: ${TB_PASSWORD:-}
      TB_TELEMETRY_KEYS: ${TB_TELEMETRY_KEYS:-temperature,humidity,battery}
      OBSERVE_APP_KEY: ${OBSERVE_APP_KEY:-}
      OBSERVE_APP_SECRET: ${OBSERVE_APP_SECRET:-}
    depends_on:
      database:
        condition: service_healthy
      thingsboard:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  iot-simulator-1:
    build:
      context: ./iot-simulator
      dockerfile: dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      THINGSBOARD_HOST: thingsboard
      THINGSBOARD_PORT: 1883
      THINGSBOARD_TOKEN: ${DEVICE_1_TOKEN}
      TELEMETRY_API_URL: ${TELEMETRY_API_URL:-http://backend:3000/api}
      TELEMETRY_JWT_TOKEN: ${TELEMETRY_JWT_TOKEN:-}
      TELEMETRY_DEVICE_ID: ${TELEMETRY_DEVICE_ID:-}
      SIMULATOR_MODE: ${SIMULATOR_MODE:-mqtt}
    depends_on:
      thingsboard:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const net = require('net'); const socket = net.createConnection({ host: process.env.THINGSBOARD_HOST, port: Number(process.env.THINGSBOARD_PORT) }); socket.setTimeout(3000); socket.on('connect', () => { socket.destroy(); }); socket.on('timeout', () => { socket.destroy(); process.exit(1); }); socket.on('error', () => process.exit(1));"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  iot-simulator-2:
    build:
      context: ./iot-simulator
      dockerfile: dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      THINGSBOARD_HOST: thingsboard
      THINGSBOARD_PORT: 1883
      THINGSBOARD_TOKEN: ${DEVICE_2_TOKEN}
      TELEMETRY_API_URL: ${TELEMETRY_API_URL:-http://backend:3000/api}
      TELEMETRY_JWT_TOKEN: ${TELEMETRY_JWT_TOKEN:-}
      TELEMETRY_DEVICE_ID: ${TELEMETRY_DEVICE_ID:-}
      SIMULATOR_MODE: ${SIMULATOR_MODE:-mqtt}
    depends_on:
      thingsboard:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const net = require('net'); const socket = net.createConnection({ host: process.env.THINGSBOARD_HOST, port: Number(process.env.THINGSBOARD_PORT) }); socket.setTimeout(3000); socket.on('connect', () => { socket.destroy(); }); socket.on('timeout', () => { socket.destroy(); process.exit(1); }); socket.on('error', () => process.exit(1));"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  thingsboard-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TB_DB_NAME:-thingsboard}
      POSTGRES_USER: ${TB_DB_USER:-tbuser}
      POSTGRES_PASSWORD: ${TB_DB_PASSWORD:-change_this_password}
    volumes:
      - thingsboard-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  thingsboard:
    image: thingsboard/tb-node:4.3.1.6
    restart: unless-stopped
    depends_on:
      thingsboard-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://thingsboard-db:5432/${TB_DB_NAME:-thingsboard}
      SPRING_DATASOURCE_USERNAME: ${TB_DB_USER:-tbuser}
      SPRING_DATASOURCE_PASSWORD: ${TB_DB_PASSWORD:-change_this_password}
      TB_QUEUE_TYPE: in-memory
    ports:
      - "${TB_HTTP_PORT:-18080}:8080"
      - "${TB_MQTT_PORT:-11883}:1883"
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 180s

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget --spider --quiet http://127.0.0.1/ || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "wget --spider --quiet http://127.0.0.1/ || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
volumes:
  thingsboard-db-data:
  postgres_data: